<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🌤 Weather Dashboard</h1>
    <p class="subtitle">ค้นหาสภาพอากาศของเมืองที่ต้องการ</p>
    <div class="search-box">
        <input
            type="text" 
            id="cityInput" 
            placeholder="เช่น Bangkok, Chiang Mai, Phuket" 
            value="Bangkok, Chiang Mai, Phuket"
        >

        <button id="searchButton">ค้นหา</button>
    </div>

    <p id="loading" class="loading"></p>
    <p id="error" class="error"></p>

    <div id="weatherContainer" class="weather-container"></div>

    <script src="app.js"></script>
</body>
</html>
